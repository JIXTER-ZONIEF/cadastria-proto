<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<meta name="theme-color" content="#0f1419"/>
<title>Cadastria · Metz (serveur)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous"/>
<style>
  :root{--bg:#0f1419;--panel:#1a2129;--panel2:#222c37;--line:#2e3a47;--txt:#e7edf3;--dim:#9fb0c0;--me:#3da5ff;--gold:#ffcf5c;--green:#37c878;--bad:#ff6b6b}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  #map{position:fixed;inset:0;background:#0f1419}.leaflet-container{background:#0f1419}
  #hud{position:fixed;top:0;left:0;right:0;z-index:600;display:flex;gap:10px;align-items:center;padding:8px 10px;background:linear-gradient(#0f1419ee,#0f1419bb);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
  .stat{display:flex;flex-direction:column;line-height:1.05}.stat b{font-size:15px}.stat span{font-size:10px;color:var(--dim);text-transform:uppercase}
  #hud .grow{flex:1}
  .btn{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600;cursor:pointer}
  .btn:active{transform:scale(.97)}.btn.primary{background:var(--me);border-color:var(--me);color:#04243f}.btn:disabled{opacity:.4}
  #tag{position:fixed;top:54px;left:0;right:0;z-index:500;display:flex;justify-content:center;pointer-events:none}#tag .pill{background:#1a2129dd;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:11px;color:var(--dim)}
  #sheet{position:fixed;left:0;right:0;bottom:0;z-index:700;background:var(--panel);border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:14px;transform:translateY(120%);transition:transform .2s;max-height:70vh;overflow:auto}#sheet.open{transform:none}
  #sheet h3{margin:0 0 2px}.sub{color:var(--dim);font-size:12px;margin-bottom:8px}
  .kv{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line)}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
  .types{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.typ{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 2px;text-align:center;font-size:11px;cursor:pointer}.typ.sel{border-color:var(--me);background:#143049}.typ .e{font-size:20px;display:block}
  #toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:800;background:#000d;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}#toast.show{opacity:1}
  .amico{font-size:15px;text-align:center;text-shadow:0 1px 2px #000a;pointer-events:none}
  #banner{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:900;background:#0f1419;color:var(--dim);font-size:14px}
</style>
</head>
<body>
<div id="map"></div>
<div id="hud">
  <div class="stat"><b id="money">—</b><span>crédits</span></div>
  <div class="stat"><b id="empire">—</b><span>empire</span></div>
  <div class="stat"><b id="day">—</b><span>jour</span></div>
  <div class="grow"></div>
  <button class="btn primary" id="nextDay">Jour +</button>
</div>
<div id="tag"><div class="pill">🌐 Monde serveur (partagé) · Metz · API cadastria-api.jixter.fr</div></div>
<div id="sheet"><h3 id="sTitle">Parcelle</h3><div class="sub" id="sSub"></div><div id="sBody"></div></div>
<div id="toast"></div>
<div id="banner">Connexion au serveur…</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<script>
const API='https://cadastria-api.jixter.fr/api';
const EMOJI={RESIDENTIEL:'🏠',COMMERCE:'🏪',ECOLE:'🏫',PARC:'🌳',TRANSPORT:'🚇'};
const TYPES=['COMMERCE','ECOLE','PARC','TRANSPORT','RESIDENTIEL'];
let map,layer,markers,cells=[],byCell={},selected=null;

function valColor(v,socle){const r=Math.max(0,Math.min(1,(v-50)/200));const st=[[44,70,110],[40,120,90],[70,180,95],[200,190,80],[255,207,92]];const t=r*(st.length-1),i=Math.floor(t),f=t-i,a=st[i],b=st[Math.min(i+1,st.length-1)];return`rgb(${a[0]+(b[0]-a[0])*f|0},${a[1]+(b[1]-a[1])*f|0},${a[2]+(b[2]-a[2])*f|0})`;}
function style(c){let color='#5a6b7a',w=1;if(c.owner==='me'){color='#3da5ff';w=2.5;}else if(c.owner){color='#e0567a';w=2;}if(selected&&selected.cell===c.cell){color='#fff';w=3.5;}return{color,weight:w,fillColor:valColor(c.value,c.socle),fillOpacity:.62,opacity:.95};}

async function api(path,method){const r=await fetch(API+path,{method:method||'GET',headers:{'Content-Type':'application/json'},body:method==='POST'&&arguments[2]?JSON.stringify(arguments[2]):undefined});if(!r.ok){let m='erreur';try{m=(await r.json()).message||m;}catch(e){}throw new Error(m);}return r.json();}

async function loadWorld(){
  cells=await api('/world');byCell={};cells.forEach(c=>byCell[c.cell]=c);
  layer.clearLayers();markers.clearLayers();const grp=L.featureGroup();
  for(const c of cells){const poly=L.polygon(c.boundary,style(c));poly.on('click',e=>{L.DomEvent.stop(e);select(c.cell);});poly.addTo(layer);c._poly=poly;grp.addLayer(poly);if(c.amenity){L.marker([c.lat,c.lon],{interactive:false,icon:L.divIcon({className:'',html:`<div class="amico">${EMOJI[c.amenity.type]||'•'}</div>`,iconSize:[16,16]})}).addTo(markers);}}
  if(!loadWorld._fit){try{map.fitBounds(grp.getBounds().pad(.05));loadWorld._fit=1;}catch(e){}}
}
function redraw(){for(const c of cells)c._poly&&c._poly.setStyle(style(c));}
async function refreshState(){const s=await api('/state');document.getElementById('money').textContent=s.money;document.getElementById('empire').textContent=s.empire;document.getElementById('day').textContent=s.day;}

function select(cell){selected=byCell[cell];renderSheet();document.getElementById('sheet').classList.add('open');redraw();}
function renderSheet(){const c=selected;document.getElementById('sTitle').textContent=(c.amenity?EMOJI[c.amenity.type]+' ':'')+'Parcelle';document.getElementById('sSub').textContent='socle '+c.socle+' · valeur '+c.value;
  let h=`<div class="kv"><span>Propriétaire</span><b>${c.owner==='me'?'TOI':(c.owner?'@'+c.owner:'libre')}</b></div>`;
  if(c.amenity)h+=`<div class="kv"><span>Aménité</span><b>${EMOJI[c.amenity.type]} ${c.amenity.type.toLowerCase()} niv.${c.amenity.level}</b></div>`;
  h+=`<div class="row">`;
  if(!c.owner)h+=`<button class="btn primary" style="flex:1" onclick="doBuy('${c.cell}')">Acheter · ${c.value} cr</button>`;
  h+=`</div>`;
  if(c.owner==='me'&&!c.amenity){h+=`<div class="sub">Construire :</div><div class="types">`+TYPES.map(t=>`<div class="typ" onclick="doBuild('${c.cell}','${t}')"><span class="e">${EMOJI[t]}</span>${t.slice(0,5).toLowerCase()}</div>`).join('')+`</div>`;}
  document.getElementById('sBody').innerHTML=h;
}
async function doBuy(cell){try{await api('/parcels/'+cell+'/buy','POST');toast('Acquis');await loadWorld();await refreshState();select(cell);}catch(e){toast(e.message);}}
async function doBuild(cell,type){try{await api('/parcels/'+cell+'/build','POST',{type,level:1});toast('Construit !');await loadWorld();await refreshState();select(cell);}catch(e){toast(e.message);}}
document.getElementById('nextDay').onclick=async()=>{try{const r=await api('/next-day','POST');toast('Jour '+r.day+' · '+(r.net>=0?'+':'')+r.net+' cr');await loadWorld();await refreshState();}catch(e){toast(e.message);}};
let tT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),1600);}

async function boot(){
  map=L.map('map',{zoomControl:false,preferCanvas:true}).setView([49.119,6.176],16);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  L.control.zoom({position:'bottomright'}).addTo(map);
  layer=L.layerGroup().addTo(map);markers=L.layerGroup().addTo(map);
  map.on('click',()=>{selected=null;document.getElementById('sheet').classList.remove('open');redraw();});
  try{await loadWorld();await refreshState();document.getElementById('banner').style.display='none';}
  catch(e){document.getElementById('banner').textContent='Serveur injoignable : '+e.message;}
}
boot();
</script>
</body>
</html>
