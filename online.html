<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<meta name="theme-color" content="#0f1419"/>
<title>Cadastria · Metz (serveur)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous"/>
<style>
  :root{--bg:#0f1419;--panel:#1a2129;--panel2:#222c37;--line:#2e3a47;--txt:#e7edf3;--dim:#9fb0c0;--me:#3da5ff;--gold:#ffcf5c;--green:#37c878;--bad:#ff6b6b}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  #map{position:fixed;inset:0;background:#0f1419}.leaflet-container{background:#0f1419}
  #hud{position:fixed;top:0;left:0;right:0;z-index:600;display:flex;gap:10px;align-items:center;padding:8px 10px;background:linear-gradient(#0f1419ee,#0f1419bb);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
  .stat{display:flex;flex-direction:column;line-height:1.05}.stat b{font-size:15px}.stat span{font-size:10px;color:var(--dim);text-transform:uppercase}
  #hud .grow{flex:1}
  .btn{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600;cursor:pointer}
  .btn:active{transform:scale(.97)}.btn.primary{background:var(--me);border-color:var(--me);color:#04243f}.btn.gold{background:var(--gold);border-color:var(--gold);color:#3a2c00}.btn:disabled{opacity:.4}
  .btn.icon{position:relative;padding:9px 11px;font-size:16px}
  .badge{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;border-radius:999px;font-size:10px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 4px}
  #tag{position:fixed;top:54px;left:0;right:0;z-index:500;display:flex;justify-content:center;pointer-events:none}#tag .pill{background:#1a2129dd;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:11px;color:var(--dim)}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:700;background:var(--panel);border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:14px;transform:translateY(120%);transition:transform .2s;max-height:74vh;overflow:auto}.sheet.open{transform:none}
  .sheet h3{margin:0 0 2px}.sub{color:var(--dim);font-size:12px;margin-bottom:8px}
  .kv{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line)}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
  .types{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.typ{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 2px;text-align:center;font-size:11px;cursor:pointer}.typ.sel{border-color:var(--me);background:#143049}.typ .e{font-size:20px;display:block}
  .item{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
  .item .top{display:flex;justify-content:space-between;align-items:center}.item .price{color:var(--gold);font-weight:700}
  .item .meta{color:var(--dim);font-size:12px;margin:3px 0 6px}
  .panhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.panhead h3{margin:0}
  #toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:800;background:#000d;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center;max-width:86vw}#toast.show{opacity:1}
  .amico{font-size:15px;text-align:center;text-shadow:0 1px 2px #000a;pointer-events:none}
  #banner{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:900;background:#0f1419;color:var(--dim);font-size:14px}
</style>
</head>
<body>
<div id="map"></div>
<div id="hud">
  <div class="stat"><b id="money">—</b><span>crédits</span></div>
  <div class="stat"><b id="empire">—</b><span>empire</span></div>
  <div class="stat"><b id="day">—</b><span>jour</span></div>
  <div class="grow"></div>
  <button class="btn icon" id="feedBtn" title="Actualité du monde">📰<span class="badge" id="wdBadge" style="display:none;background:#3da5ff;color:#04243f"></span></button>
  <button class="btn icon" id="marketBtn" title="Biens à vendre">🏷️</button>
  <button class="btn icon" id="pfBtn" title="Mes biens & objectifs">📋<span class="badge" id="offBadge" style="display:none"></span></button>
  <button class="btn primary" id="nextDay">Jour +</button>
</div>
<div id="tag"><div class="pill">🌐 Monde serveur (partagé) · Metz · API cadastria-api.jixter.fr</div></div>
<div id="sheet" class="sheet"><h3 id="sTitle">Parcelle</h3><div class="sub" id="sSub"></div><div id="sBody"></div></div>
<div id="panel" class="sheet"><div class="panhead"><h3 id="pTitle">—</h3><button class="btn" onclick="closePanel()">✕</button></div><div id="pBody"></div></div>
<div id="toast"></div>
<div id="banner">Connexion au serveur…</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<script>
const API='https://cadastria-api.jixter.fr/api';
const PID=localStorage.getItem('cadastria_pid')||(()=>{const v='p-'+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('cadastria_pid',v);return v;})();
const EMOJI={RESIDENTIEL:'🏠',COMMERCE:'🏪',ECOLE:'🏫',PARC:'🌳',TRANSPORT:'🚇'};
const TYPES=['COMMERCE','ECOLE','PARC','TRANSPORT','RESIDENTIEL'];
let map,layer,markers,lineLayer,cells=[],byCell={},selected=null,linkFrom=null,myState={offers:[],contracts:[],lines:[]};

const mine=c=>c.owner===PID;
const isStation=c=>c.amenity&&c.amenity.type==='TRANSPORT';

function valColor(v,socle){const r=Math.max(0,Math.min(1,(v-50)/200));const st=[[44,70,110],[40,120,90],[70,180,95],[200,190,80],[255,207,92]];const t=r*(st.length-1),i=Math.floor(t),f=t-i,a=st[i],b=st[Math.min(i+1,st.length-1)];return`rgb(${a[0]+(b[0]-a[0])*f|0},${a[1]+(b[1]-a[1])*f|0},${a[2]+(b[2]-a[2])*f|0})`;}
function style(c){let color='#5a6b7a',w=1,dash=null;if(mine(c)){color='#3da5ff';w=2.5;}else if(c.owner){color='#e0567a';w=2;}if(c.forSale){color='#ffcf5c';w=2.5;dash='4';}if(selected&&selected.cell===c.cell){color='#fff';w=3.5;}return{color,weight:w,dashArray:dash,fillColor:valColor(c.value,c.socle),fillOpacity:.62,opacity:.95};}

async function api(path,method){const r=await fetch(API+path,{method:method||'GET',headers:{'Content-Type':'application/json','X-Player-Id':PID},body:method==='POST'&&arguments[2]?JSON.stringify(arguments[2]):undefined});if(!r.ok){let m='erreur';try{m=(await r.json()).message||m;}catch(e){}throw new Error(m);}return r.json();}

function cheers(res){if(res&&Array.isArray(res.completed)&&res.completed.length){res.completed.forEach(c=>toast('🎯 Objectif : '+c.label+' (+'+c.reward+' cr)'));}}

async function loadWorld(){
  cells=await api('/world');byCell={};cells.forEach(c=>byCell[c.cell]=c);
  layer.clearLayers();markers.clearLayers();const grp=L.featureGroup();
  for(const c of cells){const poly=L.polygon(c.boundary,style(c));poly.on('click',e=>{L.DomEvent.stop(e);select(c.cell);});poly.addTo(layer);c._poly=poly;grp.addLayer(poly);if(c.amenity){L.marker([c.lat,c.lon],{interactive:false,icon:L.divIcon({className:'',html:`<div class="amico">${EMOJI[c.amenity.type]||'•'}</div>`,iconSize:[16,16]})}).addTo(markers);}}
  if(!loadWorld._fit){try{map.fitBounds(grp.getBounds().pad(.05));loadWorld._fit=1;}catch(e){}}
}
function redraw(){for(const c of cells)c._poly&&c._poly.setStyle(style(c));}
async function refreshState(){const s=await api('/state');myState=s;document.getElementById('money').textContent=s.money;document.getElementById('empire').textContent=s.empire;document.getElementById('day').textContent=s.day;const n=(s.offers||[]).length,b=document.getElementById('offBadge');if(n){b.textContent=n;b.style.display='flex';}else b.style.display='none';drawLines();}
async function refreshAll(){await loadWorld();await refreshState();}
function drawLines(){if(!lineLayer)return;lineLayer.clearLayers();for(const [a,b] of (myState.lines||[])){const ca=byCell[a],cb=byCell[b];if(ca&&cb)L.polyline([[ca.lat,ca.lon],[cb.lat,cb.lon]],{color:'#7fd1ff',weight:4,opacity:.85,dashArray:'2 7'}).addTo(lineLayer);}}

// ---- fiche parcelle ----
function select(cell){const c=byCell[cell];
  if(linkFrom){const from=linkFrom;linkFrom=null;if(from!==cell)doConnect(from,cell);else toast('Même station');return;}
  selected=c;renderSheet();document.getElementById('sheet').classList.add('open');redraw();}
function renderSheet(){const c=selected;document.getElementById('sTitle').textContent=(c.amenity?EMOJI[c.amenity.type]+' ':'')+'Parcelle';document.getElementById('sSub').textContent='socle '+c.socle+' · valeur '+c.value+(c.forSale?' · 🏷️ en vente '+c.ask:'');
  let h=`<div class="kv"><span>Propriétaire</span><b>${mine(c)?'TOI':(c.owner?'@'+c.owner:'libre')}</b></div>`;
  if(c.amenity)h+=`<div class="kv"><span>Aménité</span><b>${EMOJI[c.amenity.type]} ${c.amenity.type.toLowerCase()} niv.${c.amenity.level}</b></div>`;
  if(isStation(c)&&c.netMult>1)h+=`<div class="kv"><span>Réseau 🚇</span><b style="color:#7fd1ff">+${Math.round((c.netMult-1)*100)}%</b></div>`;
  // achats
  if(!c.owner){h+=`<div class="row"><button class="btn primary" style="flex:1" onclick="doBuy('${c.cell}')">Acheter · ${c.value} cr</button></div>`;}
  else if(!mine(c)&&c.forSale){h+=`<div class="row"><button class="btn gold" style="flex:1" onclick="doBuy('${c.cell}')">🏷️ Acheter · ${c.ask} cr</button></div>`;}
  else if(!mine(c)){h+=`<div class="row"><button class="btn" style="flex:1" onclick="doOffer('${c.cell}',${c.value})">🤝 Proposer un achat</button></div>`;}
  // construire (les miennes, nues)
  if(mine(c)&&!c.amenity){h+=`<div class="sub">Construire :</div><div class="types">`+TYPES.map(t=>`<div class="typ" onclick="doBuild('${c.cell}','${t}')"><span class="e">${EMOJI[t]}</span>${t.slice(0,5).toLowerCase()}</div>`).join('')+`</div>`;}
  // gérer (les miennes)
  if(mine(c)){h+=`<div class="row">`;if(!c.forSale){h+=`<button class="btn" onclick="doList('${c.cell}',${c.value})">🏷️ Mettre en vente</button><button class="btn" onclick="doRegie('${c.cell}')">Vendre régie · ${Math.round(c.value*0.9)} cr</button>`;}else{h+=`<button class="btn gold" onclick="doList('${c.cell}',${c.value})">🏷️ ${c.ask} cr — modifier</button><button class="btn" onclick="doUnlist('${c.cell}')">Retirer</button>`;}h+=`</div>`;
    const offs=(myState.offers||[]).filter(o=>o.cell===c.cell);
    for(const o of offs){h+=`<div class="kv"><span>🤝 Offre de @${o.buyer}</span><b style="color:var(--green)">${o.price} cr</b></div><div class="row"><button class="btn gold" onclick="doAccept('${c.cell}','${o.buyer}')">Accepter</button><button class="btn" onclick="doRefuse('${c.cell}','${o.buyer}')">Refuser</button></div>`;}
    if(isStation(c)){h+=`<div class="row"><button class="btn" onclick="startLink('${c.cell}')">🚇 Relier une station</button></div>`;
      const myLines=(myState.lines||[]).filter(l=>l.includes(c.cell));
      for(const l of myLines){const other=l[0]===c.cell?l[1]:l[0];h+=`<div class="kv"><span>🚇 ligne vers ${EMOJI[byCell[other]&&byCell[other].amenity?byCell[other].amenity.type:'TRANSPORT']} station</span><button class="btn" style="padding:4px 8px;font-size:11px" onclick="doDisconnect('${c.cell}','${other}')">Couper</button></div>`;}
    }
  }
  document.getElementById('sBody').innerHTML=h;
}

// ---- actions ----
async function act(fn){try{await fn();}catch(e){toast(e.message);}}
async function doBuy(cell){await act(async()=>{const r=await api('/parcels/'+cell+'/buy','POST');toast('Acquis · '+(r.paid!=null?'-'+r.paid+' cr':''));await refreshAll();cheers(r);select(cell);});}
async function doBuild(cell,type){await act(async()=>{const r=await api('/parcels/'+cell+'/build','POST',{type,level:1});toast('Construit !');await refreshAll();cheers(r);select(cell);});}
async function doList(cell,value){const def=Math.round(value*1.1);const inp=prompt('Prix de vente (crédits)\nPrix réaliste estimé : '+def+' cr.\nGarde-le ou saisis le tien :',def);if(inp===null)return;const ask=Math.round(Number(String(inp).replace(',','.')))||0;await act(async()=>{const r=await api('/parcels/'+cell+'/list','POST',{ask});toast('🏷️ En vente · '+r.ask+' cr');await refreshAll();select(cell);});}
async function doUnlist(cell){await act(async()=>{await api('/parcels/'+cell+'/unlist','POST',{});toast('Retiré de la vente');await refreshAll();select(cell);});}
async function doRegie(cell){if(!confirm('Vendre ce bien à la régie (90% de sa valeur) ?'))return;await act(async()=>{const r=await api('/parcels/'+cell+'/sell-regie','POST',{});toast('Vendu régie · +'+r.gain+' cr');await refreshAll();document.getElementById('sheet').classList.remove('open');});}
async function doOffer(cell,value){const def=Math.round(value*1.2);const inp=prompt('Proposer un achat au propriétaire\nValeur estimée : '+value+' cr.\nMontant proposé :',def);if(inp===null)return;const price=Math.round(Number(String(inp).replace(',','.')))||0;await act(async()=>{await api('/parcels/'+cell+'/offer','POST',{price});toast('🤝 Offre envoyée · '+price+' cr');});}
function startLink(cell){linkFrom=cell;document.getElementById('sheet').classList.remove('open');toast('🚇 Tape une autre de TES stations pour relier');}
async function doConnect(a,b){await act(async()=>{const r=await api('/parcels/'+a+'/connect','POST',{to:b});toast('🚇 Ligne créée — réseau renforcé');await refreshAll();cheers(r);select(a);});}
async function doDisconnect(a,b){await act(async()=>{await api('/parcels/'+a+'/disconnect','POST',{to:b});toast('Ligne coupée');await refreshAll();select(a);});}
async function doAccept(cell,buyer){await act(async()=>{const r=await api('/parcels/'+cell+'/accept-offer','POST',{buyer});toast('✅ Vendu à @'+buyer+' · +'+r.price+' cr');await refreshAll();if(document.getElementById('panel').classList.contains('open'))openPortfolio();else select(cell);});}
async function doRefuse(cell,buyer){await act(async()=>{await api('/parcels/'+cell+'/refuse-offer','POST',{buyer});toast('Offre refusée');await refreshState();renderSheet();});}

document.getElementById('nextDay').onclick=()=>act(async()=>{const r=await api('/next-day','POST');toast('Jour '+r.day+' · '+(r.net>=0?'+':'')+r.net+' cr');await refreshAll();cheers(r);});

// ---- panneaux ----
function openPanel(){document.getElementById('panel').classList.add('open');}
function closePanel(){document.getElementById('panel').classList.remove('open');}
document.getElementById('marketBtn').onclick=()=>act(openMarket);
document.getElementById('pfBtn').onclick=()=>act(openPortfolio);
document.getElementById('feedBtn').onclick=()=>act(openFeed);
async function refreshFeedBadge(){try{const f=await api('/feed');const b=document.getElementById('wdBadge');b.textContent='j'+f.worldDay;b.style.display='flex';return f;}catch(e){}}
async function openFeed(){const f=await api('/feed');document.getElementById('pTitle').textContent='📰 Monde · jour '+f.worldDay;
  const evs=(f.events||[]).map(e=>`<div class="item"><div class="top"><b>${e.emoji} ${e.label}</b><span class="price" style="color:${e.factor>=1?'var(--green)':'var(--bad)'}">${e.factor>=1?'+':'-'}${Math.round(Math.abs(e.factor-1)*100)}%</span></div><div class="meta">encore ${e.ticksLeft} j</div><div class="row"><button class="btn" onclick="goTo('${e.center}')">Voir</button></div></div>`).join('');
  const items=(f.items||[]).map(it=>`<div class="meta" style="padding:4px 2px">j${it.day} · ${it.text}</div>`).join('')||'<div class="sub">Rien pour l\\'instant.</div>';
  document.getElementById('pBody').innerHTML=(evs?'<div class="sub">⚡ Événements en cours</div>'+evs:'')+'<div class="sub" style="margin-top:8px">🗞️ Derniers faits</div>'+items;
  openPanel();}

async function openMarket(){const items=await api('/market');document.getElementById('pTitle').textContent='🏷️ Biens à vendre ('+items.length+')';
  const el=document.getElementById('pBody');
  if(!items.length){el.innerHTML='<div class="sub">Aucun bien en vente. Mets un des tiens en vente, ou reviens plus tard.</div>';openPanel();return;}
  el.innerHTML=items.map(m=>{const own=m.owner===PID;const t=(m.amenity?EMOJI[m.amenity.type]+' ':'')+'Parcelle';return `<div class="item"><div class="top"><b>${t}</b><span class="price">${m.ask} cr</span></div><div class="meta">${own?'à toi':'@'+m.owner} · valeur ${m.value}</div><div class="row">${own?`<button class="btn" onclick="doUnlist('${m.cell}')">Retirer</button>`:`<button class="btn gold" onclick="mkBuy('${m.cell}')">Acheter</button>`}<button class="btn" onclick="goTo('${m.cell}')">Voir</button></div></div>`;}).join('');
  openPanel();
}
async function mkBuy(cell){await act(async()=>{const r=await api('/parcels/'+cell+'/buy','POST');toast('Acquis · -'+r.paid+' cr');await refreshAll();cheers(r);openMarket();});}

function openPortfolio(){const owned=cells.filter(mine).sort((a,b)=>b.value-a.value);
  document.getElementById('pTitle').textContent='📋 Mes biens ('+owned.length+') · empire '+myState.empire;
  const cs=(myState.contracts||[]).map(c=>`<div class="item" style="border-color:${c.done?'var(--green)':'var(--line)'}"><div class="top"><b>${c.done?'✅':'🎯'} ${c.label}</b><span class="price">+${c.reward}</span></div></div>`).join('');
  const offs=(myState.offers||[]).map(o=>`<div class="item"><div class="top"><b>🤝 Offre de @${o.buyer}</b><span class="price">${o.price} cr</span></div><div class="meta">valeur ${o.value}</div><div class="row"><button class="btn gold" onclick="doAccept('${o.cell}','${o.buyer}')">Accepter</button><button class="btn" onclick="doRefuse('${o.cell}','${o.buyer}')">Refuser</button><button class="btn" onclick="goTo('${o.cell}')">Voir</button></div></div>`).join('');
  const list=owned.length?owned.map(c=>{const t=(c.amenity?EMOJI[c.amenity.type]+' ':'')+'Parcelle';return `<div class="item"><div class="top"><b>${t}</b><span class="price">${c.value}</span></div><div class="meta">${c.forSale?'🏷️ en vente '+c.ask:'non listé'}</div><div class="row"><button class="btn" onclick="goTo('${c.cell}')">Voir</button></div></div>`;}).join(''):'<div class="sub">Tu ne possèdes rien encore.</div>';
  document.getElementById('pBody').innerHTML=
    '<div class="sub">🎯 Objectifs de saison</div>'+(cs||'<div class="sub">—</div>')
    +(offs?'<div class="sub" style="margin-top:8px">🤝 Offres reçues</div>'+offs:'')
    +'<div class="sub" style="margin-top:8px">🏙️ Bâtiments</div>'+list;
  openPanel();
}
function goTo(cell){closePanel();const c=byCell[cell];if(c){map.panTo([c.lat,c.lon]);select(cell);}}

let tT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),2200);}

async function boot(){
  map=L.map('map',{zoomControl:false,preferCanvas:true}).setView([49.119,6.176],16);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  L.control.zoom({position:'bottomright'}).addTo(map);
  layer=L.layerGroup().addTo(map);lineLayer=L.layerGroup().addTo(map);markers=L.layerGroup().addTo(map);
  map.on('click',()=>{if(linkFrom){linkFrom=null;toast('Liaison annulée');return;}selected=null;document.getElementById('sheet').classList.remove('open');redraw();});
  try{await loadWorld();await refreshState();await refreshFeedBadge();document.getElementById('banner').style.display='none';}
  catch(e){document.getElementById('banner').textContent='Serveur injoignable : '+e.message;}
  // le monde bouge tout seul (tick ~90s) : rafraîchissement discret
  setInterval(async()=>{try{await loadWorld();await refreshState();await refreshFeedBadge();}catch(e){}},60000);
}
boot();
</script>
</body>
</html>
